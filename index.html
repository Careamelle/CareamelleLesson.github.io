<!DOCTYPE html>
<html data-theme="light">
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  
  <!-- Imports 'Press Start 2P' for the retro 8-bit text, and 'Inter' for readable paragraphs -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    /* 1. Deep purple background with circuit-grid pattern */
    body {
      background-color: #3b0a66; 
      background-image: 
        linear-gradient(rgba(138, 43, 226, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(138, 43, 226, 0.2) 1px, transparent 1px);
      background-size: 30px 30px;
      font-family: 'Inter', sans-serif;
    }

    /* 2. 8-Bit Title styling with thick yellow outline */
    h1 {
      font-family: 'Press Start 2P', cursive;
      color: #7b2cbf; /* Inside purple fill */
      /* Creates the chunky yellow border and drop shadow */
      -webkit-text-stroke: 2px #ffde00; 
      text-shadow: 4px 4px 0px #ffde00;
      text-align: center;
      margin-top: 20px;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    /* 3. Pill-shaped content boxes */
    article {
      background-color: #f4f4f8; 
      color: #2d004b;
      border-radius: 30px; /* Heavy rounding like the date/location boxes */
      border: 4px solid #7b2cbf; /* Thick purple border */
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      padding: 30px;
      margin-bottom: 30px;
    }

    h2, h3 {
      color: #5a189a;
      font-weight: 600;
    }

    /* 4. Glowing interactive buttons */
    a[role="button"] {
      background-color: #7b2cbf;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 4px 0px #2a004e; /* 3D bottom edge */
      transition: all 0.2s;
    }

    a[role="button"]:hover {
      background-color: #ffde00;
      color: #3b0a66;
      box-shadow: 0 4px 0px #ccb200;
      transform: translateY(2px); /* Makes the button look pushed down */
    }

    /* 5. Instructor Profile Setup */
    .instructor-profile {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #ffde00; /* Yellow ring accent */
      object-fit: cover;
      margin: 0;
    }

    @media (max-width: 600px) {
      .instructor-profile {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    
    <!-- HEADER -->
    <h1>SWITCH ON:<br>LESSONS</h1>

    <!-- THEME / INSTRUCTOR CARD -->
    <article>
      <div class="instructor-profile">
        <img src="profile-pic.png" alt="Instructor Photo" class="profile-img">
        <div>
          <h2 style="margin-bottom: 5px;">Carmel Angelo N. Hervera</h2>
          <p style="color: #7b2cbf; font-weight: bold; margin-bottom: 10px;">
            SorSU Engineering Campus
          </p>
          <p style="font-style: italic; font-size: 1.05em; background-color: #e0d4fc; padding: 10px 15px; border-radius: 15px; display: inline-block; margin-bottom: 0;">
            "Bridging Circuits, Building Vision—Driven by Circuits, United by Vision"
          </p>
        </div>
      </div>
    </article>

    <!-- LESSONS DIRECTORY -->
    <article>
      <h3>Available Modules</h3>
      <p>Select a module below to access course materials, laboratory guides, and assignments.</p>
      
      <!-- Button to Lesson 1 -->
      <a href="lesson1.html" role="button">Run Module: Lesson 1</a>
    </article>

  </main>
</body>
</html>
